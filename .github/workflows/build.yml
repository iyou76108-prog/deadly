name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'
      - name: Build mod
        run: gradle build --no-daemon
      - name: Upload remapped mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: deadly-visuals
          path: build/libs/*-remapped.jar
          if-no-files-found: warn
