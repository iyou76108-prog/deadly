name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 25 for Fabric Loom
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'
      - name: Build Java 21 mod
        run: gradle build --no-daemon
      - name: List generated JARs
        run: find build/libs -maxdepth 1 -type f -name '*.jar' -print
      - name: Upload remapped mod JARs
        uses: actions/upload-artifact@v4
        with:
          name: deadly-visuals
          path: build/libs/*.jar
          if-no-files-found: error
